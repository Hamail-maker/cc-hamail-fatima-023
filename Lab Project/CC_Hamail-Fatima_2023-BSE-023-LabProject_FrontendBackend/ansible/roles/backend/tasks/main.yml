---
- name: Update yum cache
  yum:
    name: "*"
    state: latest
    update_cache: true

- name: Install Apache HTTPD
  yum:
    name:
      - httpd
      - wget
      - curl
    state: present

- name: Enable and start httpd service
  service:
    name: httpd
    state: started
    enabled: true

- name: Deploy backend index page
  template:
    src: backend_index.html.j2
    dest: /var/www/html/index.html
    owner: apache
    group: apache
    mode: '0644'
  notify: Restart httpd
