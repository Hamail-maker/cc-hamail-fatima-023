- name: Install Nginx
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: Deploy Nginx configuration
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
  notify: Restart Nginx

- name: Ensure Nginx is enabled and started
  systemd:
    name: nginx
    enabled: yes
    state: started

- name: Open firewall for Nginx
  ufw:
    rule: allow
    name: 'Nginx Full'